# The watchdog: SELF-HEALING scheduler insurance.
# GitHub's cron has skipped this repo's nights twice (Oct 12 and 13, 2026) —
# schedules are best-effort and not dependable on their own. So:
#   1. check: has the daily pipeline succeeded within the last 26 hours?
#        yes -> green, done.
#        no  -> fail loudly (GitHub emails the repo owner).
#   2. heal: runs ONLY when check failed — it runs the full pipeline itself
#      (same reusable workflow), so a missed night is cured within hours
#      with no human and no extra credentials.
# Plus the dbt freshness test (assert_data_is_fresh.sql) guards the data
# layer itself. Belt, suspenders, and a spare shirt.

name: Pipeline watchdog

on:
  schedule:
    - cron: "37 3 * * *"   # 03:37 UTC = 09:07 IST, after the 06:43 window
  workflow_dispatch:

permissions:
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the daily pipeline hasn't succeeded within 26 hours
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(gh api "repos/vinn27/crypto-market-elt/actions/workflows/daily-pipeline.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].updated_at')
          if [ -z "$last" ] || [ "$last" = "null" ]; then
            echo "::error::No successful daily-pipeline run found at all"
            exit 1
          fi
          echo "last successful daily run: $last"
          age_hours=$(( ( $(date +%s) - $(date -u -d "$last" +%s) ) / 3600 ))
          echo "age: ${age_hours}h (threshold 26h)"
          if [ "$age_hours" -gt 26 ]; then
            echo "::error::Daily pipeline is stale by ${age_hours}h — self-heal job will now run it"
            exit 1
          fi

  heal:
    needs: check
    if: failure()
    uses: ./.github/workflows/run-pipeline.yml
    secrets: inherit
    permissions:
      contents: write
