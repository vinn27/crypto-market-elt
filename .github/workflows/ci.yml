# CI: every push and pull request gets a fast syntax/quality gate.
# dbt parse catches broken YAML or SQL before it can reach main — the same
# class of bug as the secrets-in-if incident, but caught at commit time.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt pytest

      - name: dbt parse (syntax gate — no warehouse needed)
        working-directory: dbt
        env:
          DBT_PROFILES_DIR: .
          SNOWFLAKE_ACCOUNT: ci
          SNOWFLAKE_USER: ci
          SNOWFLAKE_PASSWORD: ci
        run: dbt parse

      - name: Unit tests (retry/backoff logic)
        run: pytest tests -q
