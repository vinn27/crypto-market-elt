# The daily trigger. The actual steps live in run-pipeline.yml (reusable),
# so the watchdog can run the exact same pipeline when the scheduler skips.

name: Daily crypto ELT

on:
  schedule:
    - cron: "13 1 * * *"   # 01:13 UTC = 06:43 IST (GitHub cron is best-effort;
                           # the watchdog self-heals any missed run at 09:07 IST)
  workflow_dispatch:

jobs:
  run:
    uses: ./.github/workflows/run-pipeline.yml
    secrets: inherit
    permissions:
      contents: write
